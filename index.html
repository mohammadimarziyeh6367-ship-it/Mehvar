<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#fff7fb"
    >

    <title>محور اعداد</title>

    <!-- =================================================
         فونت
    ================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- =================================================
         فایل CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">


    <!-- =================================================
         صفحه اول
    ================================================= -->

    <section
        id="startScreen"
        class="screen start-screen"
    >

        <!-- عکس آموزگار -->

        <div
            class="teacher-photo"
            aria-label="جای عکس آموزگار"
        >

            <div class="photo-placeholder">
                👩🏻‍🏫
            </div>

        </div>


        <!-- استیکر -->

        <div class="start-sticker">
            🔄
        </div>


        <!-- عنوان اصلی
             فقط در صفحه اول -->

        <h1>
            محور اعداد
        </h1>


        <!-- نام دانش‌آموز -->

        <input
            id="studentName"
            type="text"
            inputmode="text"
            autocomplete="off"
            placeholder="نام زیبایت را وارد کن 🌸"
            aria-label="نام دانش‌آموز"
        >


        <!-- دکمه شروع -->

        <button
            id="startButton"
            class="start-button"
            type="button"
        >

            شروع بازی 🚀

        </button>


        <!-- امضای آموزگار -->

        <footer>

            AI based education content creator
            👩🏻‍💻
            Marziyeh Mohammadi

        </footer>


    </section>



    <!-- =================================================
         صفحه دوم / بازی
    ================================================== -->

    <section
        id="gameScreen"
        class="screen game-screen hidden"
    >


        <!-- =================================================
             سربرگ
        ================================================== -->

        <div class="game-header">


            <div class="student-box">

                👩‍🎓👨‍🎓
                <span id="playerName">
                    دانش‌آموز
                </span>

            </div>


            <div class="score-box">

                امتیاز:
                <span id="score">
                    ۰
                </span>

                👏🏻🤗

            </div>


        </div>



        <!-- =================================================
             راهنمای بازی
             فقط در صفحه دوم
             بالای محور
        ================================================== -->

        <div
            class="question-type"
            id="questionType"
        >

            با انگشتت روی محور حرکت کن و جواب را پیدا کن 🤏

        </div>



        <!-- =================================================
             عبارت ریاضی
        ================================================== -->

        <div
            class="question"
            aria-live="polite"
        >

            <!-- عبارت توسط JavaScript ساخته می‌شود -->

            <span
                id="expression"
                class="expression"
            >
                ۳ + ۲
            </span>


            <span class="equals-sign">
                =
            </span>


            <input
                id="answerInput"
                class="answer-input"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                maxlength="2"
                aria-label="جواب"
            >

        </div>



        <!-- =================================================
             محور اعداد
        ================================================== -->

        <div class="number-line-wrapper">

            <div
                id="numberLine"
                class="number-line"
            >

                <!--
                    محور، اعداد، خط‌ها،
                    کمان‌ها و نقطه‌ها
                    توسط JavaScript ساخته می‌شوند.
                -->

            </div>

        </div>



        <!-- =================================================
             دکمه‌ها
        ================================================== -->

        <div class="buttons">


            <button
                id="undoButton"
                class="secondary-button"
                type="button"
            >

                ↩️  پاک کردن حرکت قبلی 

            </button>


            <button
                id="clearButton"
                class="secondary-button"
                type="button"
            >

                🧹 پاک کردن همه

            </button>


            <button
                id="checkButton"
                class="check-button"
                type="button"
            >

                ✅ بررسی جواب

            </button>


        </div>



        <!-- =================================================
             پیام
        ================================================== -->

        <div
            id="feedback"
            class="feedback"
            aria-live="polite"
        >

        </div>



        <!-- =================================================
             فشفشه
        ================================================== -->

        <div
            id="fireworkContainer"
            class="firework-container"
        >

        </div>



        <!-- =================================================
             امضا
        ================================================== -->

        <footer>

            AI based education content creator
            👩🏻‍💻
            Marziyeh Mohammadi

        </footer>


    </section>


</div>



<!-- =====================================================
     JavaScript
====================================================== -->

<script src="script.js"></script>


</body>

</html>
