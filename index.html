<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>محور اعداد</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- =========================================
         صفحه شروع
    ========================================== -->

    <section id="startScreen" class="screen">

        <div class="teacher-photo-box">

            <!--
              فعلاً جای عکس خالی است.
              بعداً عکس خودت را اینجا قرار می‌دهیم.
            -->

            <div class="photo-placeholder">
                🌷
            </div>

        </div>


        <div class="title-sticker">
            📚
        </div>


        <h1>
            محور اعداد
        </h1>


        <p class="welcome-text">
            با کمک محور اعداد، جمع و تفریق را تمرین کنیم 🌈
        </p>


        <input
            id="studentName"
            type="text"
            placeholder="نام زیبایت را وارد کن"
            autocomplete="off"
        >


        <button id="startButton">
            شروع بازی 🚀
        </button>

    </section>


    <!-- =========================================
         صفحه بازی
    ========================================== -->

    <section id="gameScreen"
             class="screen hidden">

        <header class="game-header">

            <div class="student-box">
                🌸
                <span id="playerName"></span>
            </div>


            <div class="score-box">
                امتیاز:
                <span id="score">۰</span>
            </div>

        </header>


        <div class="game-title">
            محور اعداد
        </div>


        <div id="questionType"
             class="question-type">
        </div>


        <div id="question"
             class="question">
        </div>


        <div id="movementInfo"
             class="movement-info">
            از عدد مبدأ شروع کن و حرکتت را بکش ✏️
        </div>


        <!-- =====================================
             محور
        ====================================== -->

        <div class="number-line-wrapper">

            <div id="numberLine"
                 class="number-line">

                <!--
                  محور و اعداد توسط JavaScript
                  ساخته می‌شوند.
                -->

            </div>

        </div>


        <!-- =====================================
             دکمه‌ها
        ====================================== -->

        <div class="buttons">

            <button id="undoButton"
                    class="secondary-button">
                ↩ پاک کردن حرکت قبلی
            </button>


            <button id="clearButton"
                    class="secondary-button">
                🧹 پاک کردن همه
            </button>


            <button id="checkButton"
                    class="check-button">
                بررسی پاسخ ✓
            </button>

        </div>


        <div id="feedback"
             class="feedback">
        </div>


        <!-- =====================================
             فشفشه
        ====================================== -->

        <div id="fireworkContainer"
             class="firework-container">
        </div>


        <footer>
            AI based education content creator:
            ENG Marziyeh Mohammadi
        </footer>

    </section>

</div>


<script src="script.js"></script>

</body>
</html>
