<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>الگوی منظم | ریاضی پایه اول</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       صفحه شروع
  ========================== -->
  <section id="startScreen" class="screen start-screen">

    <div class="start-card">

      <div class="teacher-frame">
        <img src="IMG_4332.jpeg"
             alt="آموزگار"
             class="teacher-photo">
      </div>

      <div class="welcome-badge">
        ریاضی پایه اول 🌈
      </div>

      <h1>الگوی منظم</h1>

      <div class="welcome-text">
        <strong>بچه‌های گلم</strong>
        <br>
        الگوخوانی خیلی مهم است.
        <br>
        پس اول الگو را بخوانید، سپس ادامه‌ دهید🥰
      </div>

      <div class="name-box">

        <label for="studentName">
          نام زیبایت را وارد کن 🌸
        </label>

        <input
          id="studentName"
          type="text"
          maxlength="25"
          autocomplete="off"
          placeholder="مثلاً سارا"
        >

      </div>

      <button id="startBtn" class="main-btn">
        شروع بازی 🚀
      </button>

    </div>

  </section>


  <!-- =========================
       صفحه بازی
  ========================== -->
  <section id="gameScreen" class="screen game-screen hidden">

    <header class="game-header">

      <button id="prevBtn" class="nav-btn">
        ➜ مرحله قبل
      </button>

      <div class="stage-info">
        <div class="game-title">
          الگوی منظم
        </div>

        <div id="stageCounter">
          مرحله ۱ از ۱۶
        </div>
      </div>

      <button id="nextBtn" class="nav-btn">
        مرحله بعد ➜
      </button>

    </header>


    <main class="game-content">

      <div id="instruction" class="instruction"></div>

      <div id="taskArea"></div>

      <!-- ناحیه الگوی تکرارشونده -->
      <div id="repeatBox" class="repeat-box hidden">

        <div class="repeat-title">
          ✨ الگوی تکرارشونده را یک بار اینجا رسم کن
        </div>

        <div id="repeatArea" class="repeat-area"></div>

      </div>


      <!-- انتخاب رنگ / شکل -->
      <div id="paletteBox" class="palette-box">

        <div class="palette-title">
          ابزار انتخاب
        </div>

        <div id="palette" class="palette"></div>

      </div>


      <button id="checkBtn" class="check-btn">
        بررسی پاسخ 🌟
      </button>


      <button id="clearBtn" class="clear-btn">
        پاک کردن پاسخ 🧹
      </button>


      <div id="feedback" class="feedback"></div>

    </main>


    <!-- امضا فقط از صفحه دوم بازی به بعد -->
    <div class="signature-wrap">
      <img
        src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
        alt="امضا"
        class="signature">
    </div>

  </section>


  <!-- =========================
       پایان بازی
  ========================== -->
  <section id="finishScreen" class="screen finish-screen hidden">

    <div class="finish-card">

      <div class="finish-icon">
        🌟
      </div>

      <h1>
        آفرین!
      </h1>

      <div id="finishText"></div>

      <div id="finalScore" class="final-score"></div>

      <button id="restartBtn" class="main-btn">
        دوباره بازی کنیم 🔄
      </button>

      <div class="signature-wrap finish-signature">
        <img
          src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
          alt="امضا"
          class="signature">
      </div>

    </div>

  </section>


  <script src="script.js"></script>

</body>
</html>
