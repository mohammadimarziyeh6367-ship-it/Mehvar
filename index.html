<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>محور اعداد</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="app">


    <!-- =========================================
         صفحه شروع
    ========================================== -->

    <section
        id="startScreen"
        class="screen start-screen"
    >


        <!-- جای عکس آموزگار -->

        <div class="teacher-photo">

            <div class="photo-placeholder">
                🌷
            </div>

        </div>


        <div class="start-sticker">
            📚
        </div>


        <h1>
            محور اعداد
        </h1>


        <p class="welcome-text">
            با کمک محور اعداد، جمع و تفریق را تمرین کنیم
        </p>


        <input
            id="studentName"
            type="text"
            placeholder="نام زیبایت را وارد کن"
            autocomplete="off"
        >


        <button
            id="startButton"
            class="start-button"
        >
            شروع بازی 🚀
        </button>


    </section>
<footer class="creator-credit">
    AI based education content creator 👩🏻‍💻 Marziyeh Mohammadi
</footer>


    <!-- =========================================
         صفحه بازی
    ========================================== -->

    <section
        id="gameScreen"
        class="screen game-screen hidden"
    >


        <!-- اطلاعات بالا -->

        <div class="game-header">


            <div class="student-box">

                🌸

                <span id="playerName">
                </span>

            </div>


            <div class="score-box">

                امتیاز:

                <span id="score">
                    ۰
                </span>

            </div>


        </div>



        <!-- عنوان -->

        <div class="game-title">
            محور اعداد
        </div>



        <!-- نوع سؤال -->

        <div
            id="questionType"
            class="question-type"
        >
        </div>



        <!-- =====================================
             عبارت + جای خالی
        ====================================== -->

        <div
            id="question"
            class="question"
        >

            <span
                id="expression"
                class="expression"
            >
            </span>


            <span class="equals-sign">
                =
            </span>


            <input
                id="answerInput"
                class="answer-input"
                type="text"
                inputmode="numeric"
                maxlength="2"
                placeholder="؟"
                autocomplete="off"
            >

        </div>



        <!-- =====================================
             محور اعداد
        ====================================== -->

        <div class="number-line-wrapper">


            <div
                id="numberLine"
                class="number-line"
            >
            </div>


        </div>



        <!-- =====================================
             دکمه‌ها
        ====================================== -->

        <div class="buttons">


            <button
                id="undoButton"
                class="secondary-button"
            >
                ↩ پاک کردن حرکت قبلی
            </button>


            <button
                id="clearButton"
                class="secondary-button"
            >
                🧹 پاک کردن همه
            </button>


            <button
                id="checkButton"
                class="check-button"
            >
                بررسی پاسخ ✓
            </button>


        </div>



        <!-- پیام -->

        <div
            id="feedback"
            class="feedback"
        >
        </div>



        <!-- =====================================
             فشفشه
        ====================================== -->

        <div
            id="fireworkContainer"
            class="firework-container"
        >
        </div>



        <!-- =====================================
             پایین صفحه
        ====================================== -->

        <footer>

            AI based education content creator:
            ENG Marziyeh Mohammadi

        </footer>


    </section>
<footer class="creator-credit">
    AI based education content creator 👩🏻‍💻 Marziyeh Mohammadi
</footer>

</div>


<script src="script.js"></script>

</body>

</html>
